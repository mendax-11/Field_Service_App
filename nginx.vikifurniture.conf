# ─────────────────────────────────────────────────────────────────────────────
#  Nginx config for assembly.vikifurniture.com
#  Place this file at: /etc/nginx/sites-available/timberflow
#  Then: sudo ln -s /etc/nginx/sites-available/timberflow /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name assembly.vikifurniture.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assembly.vikifurniture.com;

    # SSL — managed by Certbot (run: sudo certbot --nginx -d assembly.vikifurniture.com)
    ssl_certificate     /etc/letsencrypt/live/assembly.vikifurniture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assembly.vikifurniture.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve the React app from the current symlink
    root /var/www/timberflow/current;
    index index.html;

    # SPA fallback — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — aggressive caching (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

